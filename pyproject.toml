[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["functions"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["functions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.13"
mypy_path = "functions"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["functions/rmsync"]
